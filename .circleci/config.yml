version: 2.1

executors:
  node-worker:
    docker:
      - image: cimg/node:22.12.0

commands:
  install-worker:
    steps:
      - checkout
      - run:
          name: Install Worker dependencies
          command: npm --prefix worker ci

jobs:
  frontend-build:
    executor: node-worker
    steps:
      - checkout
      - run:
          name: Print frontend runtime versions
          command: |
            node -v
            npm -v
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Lint frontend
          command: npm run lint
      - run:
          name: Build frontend
          environment:
            VITE_BACKEND_URL: /api
            VITE_API_BASE_URL: /api
          command: npm run build

  worker-root-contracts:
    executor: node-worker
    steps:
      - checkout
      - run:
          name: Install root test dependencies
          command: npm ci
      - run:
          name: Run fast-path and v2 contract tests
          command: npm run test:worker

  worker-live-foundation-tests:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Run complete disabled live foundation tests
          command: npm --prefix worker run test:live-foundation

  worker-provider-tests:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Run BTCC and Bitget provider contract tests
          command: npm --prefix worker run test:provider-contracts

  worker-recovery-ingestion-plan-tests:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Run immutable recovery ingestion plan tests
          command: node --experimental-strip-types --test worker/tests/live-recovery-ingestion.test.ts

  worker-recovery-ingestion-store-tests:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Run transactional recovery ingestion store tests
          command: node --experimental-strip-types --test worker/tests/live-recovery-ingestion-store.test.ts

  worker-recovery-accounting-approval-tests:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Run recovery accounting approval and store tests
          command: node --experimental-strip-types --test worker/tests/live-recovery-accounting-approval.test.ts worker/tests/live-recovery-accounting-approval-store.test.ts

  worker-typecheck:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Type-check complete Cloudflare Worker
          command: npm --prefix worker run build

  worker-provider-typecheck:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Type-check BTCC and Bitget provider contracts
          command: npm --prefix worker run build:provider-contracts

  worker-paper-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify paper-safety contract
          command: npm --prefix worker run verify:paper-safety

  worker-live-candidate-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify disabled live-candidate entrypoint safety
          command: node worker/scripts/verify-live-candidate-safety.mjs

  worker-candidate-command-lock-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify candidate command execution lock
          command: node worker/scripts/verify-candidate-command-lock.mjs

  worker-candidate-evidence-persistence-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify candidate evidence persistence and retries
          command: node worker/scripts/verify-candidate-evidence-persistence.mjs

  worker-candidate-projection-observability-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify projection observability and acknowledgment isolation
          command: node worker/scripts/verify-candidate-projection-observability.mjs

  worker-fill-accounting-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify FIFO accounting and reconciliation isolation
          command: node worker/scripts/verify-fill-accounting-safety.mjs

  worker-reservation-settlement-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify versioned reservation settlement
          command: node worker/scripts/verify-reservation-settlement-safety.mjs

  worker-exchange-recovery-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify BTCC and Bitget recovery boundaries
          command: node worker/scripts/verify-exchange-recovery-safety.mjs

  worker-recovery-ingestion-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify immutable recovery ingestion boundaries
          command: node worker/scripts/verify-recovery-ingestion-safety.mjs

  worker-recovery-accounting-approval-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify recovery accounting approval remains non-dispatching
          command: node worker/scripts/verify-recovery-accounting-approval-safety.mjs

  worker-regulated-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify regulated foundation safety contract
          command: npm --prefix worker run verify:regulated-foundation-safety

  worker-certification-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify certification safety contract
          command: npm --prefix worker run verify:certification-safety

  worker-cryptoops-operational-safety:
    executor: node-worker
    steps:
      - checkout
      - run:
          name: Verify operational CryptoOps Actions remain read-only
          command: node scripts/verify-cryptoops-readonly-openapi.mjs

  worker-cryptoops-candidate-safety:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Verify candidate CryptoOps schemas remain read-only
          command: npm --prefix worker run verify:cryptoops-readonly-openapi

  worker-safety-contracts:
    executor: node-worker
    steps:
      - run:
          name: Confirm all Worker safety contracts passed
          command: echo "All Worker safety contracts passed."

  worker-dry-run-bundles:
    executor: node-worker
    steps:
      - install-worker
      - run:
          name: Build disabled live-candidate dry-run bundle
          command: npm --prefix worker run bundle:live-candidate
      - run:
          name: Build disabled withdrawal-candidate dry-run bundle
          command: npm --prefix worker run bundle:withdrawals-candidate

  worker-fast-path:
    executor: node-worker
    steps:
      - run:
          name: Confirm all Worker gates passed
          command: echo "All Worker fast-path gates passed."

  backend-test-audit:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Print backend runtime versions
          command: |
            python --version
            python -m pip --version
      - run:
          name: Install backend dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
      - run:
          name: Verify backend import surface
          command: python -m py_compile backend/app.py backend/public_app.py
      - run:
          name: Lint backend (ruff)
          command: python -m ruff check backend/ --select E,W,F --ignore E402,F401,E501,E741 --exit-zero
      - run:
          name: Run full backend test suite
          command: python -m pytest backend/tests/ -x -q
      - run:
          name: Run stabilization test contract
          command: |
            python -m pytest \
              backend/tests/test_event_log_store.py \
              backend/tests/test_audit_store_event_log.py \
              backend/tests/test_event_log_router.py \
              tests/test_provider_registry.py \
              tests/test_integrations_endpoint.py \
              tests/test_waitlist_endpoint.py \
              -q
      - run:
          name: Run structural repo audit
          command: python scripts/repo_audit.py

workflows:
  version: 2
  stabilize-production-runtime:
    jobs:
      - frontend-build
      - worker-root-contracts
      - worker-live-foundation-tests
      - worker-provider-tests
      - worker-recovery-ingestion-plan-tests
      - worker-recovery-ingestion-store-tests
      - worker-recovery-accounting-approval-tests
      - worker-typecheck
      - worker-provider-typecheck
      - worker-paper-safety
      - worker-live-candidate-safety
      - worker-candidate-command-lock-safety
      - worker-candidate-evidence-persistence-safety
      - worker-candidate-projection-observability-safety
      - worker-fill-accounting-safety
      - worker-reservation-settlement-safety
      - worker-exchange-recovery-safety
      - worker-recovery-ingestion-safety
      - worker-recovery-accounting-approval-safety
      - worker-regulated-safety
      - worker-certification-safety
      - worker-cryptoops-operational-safety
      - worker-cryptoops-candidate-safety
      - worker-safety-contracts:
          requires:
            - worker-paper-safety
            - worker-live-candidate-safety
            - worker-candidate-command-lock-safety
            - worker-candidate-evidence-persistence-safety
            - worker-candidate-projection-observability-safety
            - worker-fill-accounting-safety
            - worker-reservation-settlement-safety
            - worker-exchange-recovery-safety
            - worker-recovery-ingestion-safety
            - worker-recovery-accounting-approval-safety
            - worker-regulated-safety
            - worker-certification-safety
            - worker-cryptoops-operational-safety
            - worker-cryptoops-candidate-safety
      - worker-dry-run-bundles
      - worker-fast-path:
          requires:
            - worker-root-contracts
            - worker-live-foundation-tests
            - worker-provider-tests
            - worker-recovery-ingestion-plan-tests
            - worker-recovery-ingestion-store-tests
            - worker-recovery-accounting-approval-tests
            - worker-typecheck
            - worker-provider-typecheck
            - worker-safety-contracts
            - worker-dry-run-bundles
      - backend-test-audit
