version: 2.1

jobs:
  frontend-build:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Print frontend runtime versions
          command: |
            node -v
            npm -v
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Lint frontend
          command: npm run lint
      - run:
          name: Build frontend
          environment:
            VITE_BACKEND_URL: /api
            VITE_API_BASE_URL: /api
          command: npm run build

  worker-fast-path:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Print Worker runtime versions
          command: |
            node -v
            npm -v
      - run:
          name: Install root test dependencies
          command: npm ci
      - run:
          name: Run fast-path and v2 contract tests
          command: npm run test:worker
      - run:
          name: Install Worker dependencies
          command: npm --prefix worker ci
      - run:
          name: Type-check Cloudflare Worker
          command: npm --prefix worker run build
      - run:
          name: Verify paper-safety contract
          command: npm --prefix worker run verify:paper-safety

  backend-test-audit:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Print backend runtime versions
          command: |
            python --version
            python -m pip --version
      - run:
          name: Install backend dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
      - run:
          name: Verify backend import surface
          command: python -m py_compile backend/app.py backend/public_app.py
      - run:
          name: Lint backend (ruff)
          command: python -m ruff check backend/ --select E,W,F --ignore E402,F401,E501,E741 --exit-zero
      - run:
          name: Run full backend test suite
          command: python -m pytest backend/tests/ -x -q
      - run:
          name: Run stabilization test contract
          command: |
            python -m pytest \
              backend/tests/test_event_log_store.py \
              backend/tests/test_audit_store_event_log.py \
              backend/tests/test_event_log_router.py \
              tests/test_provider_registry.py \
              tests/test_integrations_endpoint.py \
              tests/test_waitlist_endpoint.py \
              -q
      - run:
          name: Run structural repo audit
          command: python scripts/repo_audit.py

  production-lock-frontend-worker:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Block committed runtime secret files
          command: |
            set -euo pipefail
            forbidden_files=$(find . \
              -path ./.git -prune -o \
              -path ./node_modules -prune -o \
              -path ./dist -prune -o \
              \( -name '.env' -o -name '.env.production' -o -name '.env.staging' -o -name '.env.preview' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
              -type f -print)
            if [ -n "$forbidden_files" ]; then
              echo "Forbidden runtime secret material is committed:"
              echo "$forbidden_files"
              exit 1
            fi
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Lint frontend
          command: npm run lint --if-present
      - run:
          name: Build frontend with production routing contract
          environment:
            VITE_BACKEND_URL: /api
            VITE_API_BASE_URL: /api
          command: npm run build
      - run:
          name: Verify frontend artifact
          command: |
            set -euo pipefail
            test -f dist/index.html
            test -d dist/assets
      - run:
          name: Install Worker dependencies
          command: npm --prefix worker ci
      - run:
          name: Type-check hardened Cloudflare Worker
          command: npm --prefix worker run build
      - run:
          name: Verify hardened production safety boundary
          command: npm --prefix worker run verify:paper-safety
      - run:
          name: Validate hardened Wrangler bundle
          command: npx wrangler deploy --dry-run --outdir /tmp/crypto-signal-bot-worker-dry-run --config wrangler.production.toml

  production-lock-backend-audit:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Block committed runtime secret files
          command: |
            set -euo pipefail
            forbidden_files=$(find . \
              -path ./.git -prune -o \
              -path ./node_modules -prune -o \
              -path ./dist -prune -o \
              \( -name '.env' -o -name '.env.production' -o -name '.env.staging' -o -name '.env.preview' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
              -type f -print)
            if [ -n "$forbidden_files" ]; then
              echo "Forbidden runtime secret material is committed:"
              echo "$forbidden_files"
              exit 1
            fi
      - run:
          name: Install backend dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
      - run:
          name: Verify backend import surface
          command: python -m py_compile backend/app.py backend/public_app.py
      - run:
          name: Lint backend (ruff)
          command: python -m ruff check backend/ --select E,W,F --ignore E402,F401,E501,E741 --exit-zero
      - run:
          name: Run full backend test suite
          command: python -m pytest backend/tests/ -x -q
      - run:
          name: Run structural repository audit
          command: python scripts/repo_audit.py
      - run:
          name: Run production stabilization contract
          command: |
            set -euo pipefail
            python -m pytest \
              backend/tests/test_event_log_store.py \
              backend/tests/test_audit_store_event_log.py \
              backend/tests/test_event_log_router.py \
              tests/test_provider_registry.py \
              tests/test_integrations_endpoint.py \
              tests/test_waitlist_endpoint.py \
              -q
      - run:
          name: Confirm production lock artifact exists
          command: test -f docs/PRODUCTION_LOCK.md

  production-release-gate:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Confirm release gate artifacts
          command: |
            set -euo pipefail
            test -f docs/PRODUCTION_LOCK.md
            test -f wrangler.production.toml
            test -f worker/src/index_production.ts
            echo "Production release gate passed"

workflows:
  version: 2
  stabilize-production-runtime:
    jobs:
      - frontend-build
      - worker-fast-path
      - backend-test-audit
      - production-lock-frontend-worker
      - production-lock-backend-audit
      - production-release-gate:
          requires:
            - frontend-build
            - worker-fast-path
            - backend-test-audit
            - production-lock-frontend-worker
            - production-lock-backend-audit
