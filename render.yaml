services:
  - type: web
    name: crypto-signal-bot-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Safe production-readiness baseline: simulation only.
      - key: EXCHANGE_MODE
        value: paper
      - key: TRADING_MODE
        value: paper
      - key: NETWORK
        value: testnet
      - key: ALLOW_MAINNET
        value: "false"
      - key: EXCHANGE
        value: coingecko
      - key: PAPER_USE_LIVE_MARKET_DATA
        value: "true"
      - key: MARKET_DATA_PUBLIC_EXCHANGE
        value: coingecko
      - key: PAPER_STARTING_BALANCE_USDT
        value: "10000"

      - key: GUARDIAN_MAX_DRAWDOWN_PCT
        value: "10"
      - key: GUARDIAN_MAX_DAILY_LOSS_PCT
        value: "5"
      - key: GUARDIAN_MAX_API_ERRORS
        value: "5"
      - key: GUARDIAN_MAX_FAILED_ORDERS
        value: "3"

      - key: TELEGRAM_ALERTS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://crypto-signal-bot-indol.vercel.app
      - key: EVENT_LOG_ENABLED
        value: "true"
      - key: EVENT_LOG_PATH
        value: /tmp/crypto-signal-bot/event_log.db
      - key: AUDIT_STORE_PATH
        value: /tmp/crypto-signal-bot/audit.json
      - key: EARNINGS_STORE_PATH
        value: /tmp/crypto-signal-bot/earnings.json
      - key: RATE_LIMIT_RPM
        value: "120"
      - key: BACKEND_API_KEY
        sync: false
