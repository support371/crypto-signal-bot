name = "crypto-signal-bot-reviewed-operations"
main = "worker/src/index_reviewed_operations.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
# No public routes, cron triggers or second coordinator class. The namespace
# belongs to the isolated candidate Worker. Never bind this service to paper D1.
# Configure OPERATOR_API_KEY_HASHES and CANDIDATE_ACCOUNTING_TOKEN as secrets.

[[d1_databases]]
binding = "DB"
database_name = "crypto-signal-bot-live-candidate-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "EXCHANGE_ACCOUNT_COORDINATOR"
class_name = "ExchangeAccountCoordinator"
script_name = "crypto-signal-bot-live-candidate"
