# One-off: create the AGENT_MEMORY KV namespace and check R2 bucket status.
# Triggered manually via workflow_dispatch. Makes no code changes and deploys nothing.
name: create-kv-namespace (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-kv:
    name: Create AGENT_MEMORY KV namespace
    runs-on: [self-hosted, cryptoops, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: List existing KV namespaces
        id: kvlist
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler kv namespace list > "$RUNNER_TEMP/kv-list.json"
          cat "$RUNNER_TEMP/kv-list.json"

      - name: Create AGENT_MEMORY KV namespace if missing
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q '"title":"AGENT_MEMORY"' "$RUNNER_TEMP/kv-list.json" \
             || grep -q '"title": "AGENT_MEMORY"' "$RUNNER_TEMP/kv-list.json"; then
            echo "AGENT_MEMORY namespace already exists; skipping creation."
          else
            echo "Creating AGENT_MEMORY KV namespace..."
            npx wrangler kv namespace create AGENT_MEMORY
          fi

      - name: Check R2 bucket status (read-only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npx wrangler r2 bucket list || echo "R2_CHECK_FAILED_OR_NOT_ENABLED"
