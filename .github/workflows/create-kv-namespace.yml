# One-off: create the AGENT_MEMORY KV namespace and check R2 bucket status.
# Triggered manually via workflow_dispatch. Makes no code changes and deploys nothing.
name: create-kv-namespace (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-kv:
    name: Create AGENT_MEMORY KV namespace
    runs-on: [self-hosted, cryptoops, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Create AGENT_MEMORY KV namespace
        id: kvcreate
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "--- attempting KV namespace creation ---"
          npx wrangler kv namespace create AGENT_MEMORY 2>&1 | tee "$RUNNER_TEMP/kv-create.log"
          echo "--- wrangler exit: ${PIPESTATUS[0]} ---"

      - name: Check R2 bucket status (read-only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "--- R2 bucket list ---"
          npx wrangler r2 bucket list 2>&1 || echo "R2_CHECK_FAILED_OR_NOT_ENABLED"
