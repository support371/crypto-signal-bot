name: CryptoOps Read-Only Actions (manual advisory)

# Required read-only Action validation runs in CircleCI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoops-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prove Custom GPT Actions are read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify read-only schemas and policy
        run: node scripts/verify-cryptoops-readonly-openapi.mjs

      - name: Reject credential files in the Action bundle
        run: |
          set -euo pipefail
          forbidden=$(find gpt-actions/url \
            \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env*' -o -name '.dev.vars' \) \
            -type f -print)
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
