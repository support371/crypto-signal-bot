name: kv-debug (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kv-debug:
    runs-on: [self-hosted, cryptoops, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-hosted-release-python
      - name: List KV namespaces in token account
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.143.0 kv namespace list
