name: Live Candidate Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/live/**'
      - 'worker/src/index_live_candidate.ts'
      - 'worker/tests/live-foundation.test.ts'
      - 'worker/tests/live-ledger.test.ts'
      - 'worker/tests/live-reconciliation.test.ts'
      - 'worker/tests/live-audit.test.ts'
      - 'worker/migrations/003_live_release_authorizations.sql'
      - 'worker/migrations/004_live_idempotency_records.sql'
      - 'worker/migrations/005_live_ledger_and_reservations.sql'
      - 'worker/migrations/006_live_immutable_audit.sql'
      - 'worker/scripts/verify-live-candidate-safety.mjs'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/tsconfig.json'
      - 'wrangler.live-candidate.toml'
      - '.github/workflows/live-candidate-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-candidate-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, migrate, bundle, and prove execution lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run exact-decimal, product-rule, risk, ledger, reconciliation, and audit tests
        run: npm run test:live-foundation

      - name: Typecheck Worker
        run: npm run build:live-candidate

      - name: Verify live-candidate safety invariants
        run: npm run verify:live-candidate-safety

      - name: Apply release authorization migration locally
        run: npm run migrate:003:local

      - name: Apply idempotency migration locally
        run: npm run migrate:004:local

      - name: Apply ledger and reservation migration locally
        run: npm run migrate:005:local

      - name: Apply immutable audit migration locally
        run: npm run migrate:006:local

      - name: Build a dry-run Cloudflare bundle
        run: npm run bundle:live-candidate

      - name: Reject committed runtime secret files
        run: |
          set -euo pipefail
          forbidden=$(find .. \
            -path ../.git -prune -o \
            -path ../node_modules -prune -o \
            -path ../worker/.wrangler -prune -o \
            \( -name '.env' -o -name '.env.production' -o -name '.env.staging' -o -name '.env.preview' -o -name '.dev.vars' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
            -type f -print)
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
