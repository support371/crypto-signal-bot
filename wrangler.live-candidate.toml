name = "crypto-signal-bot-live-candidate"
main = "worker/src/index_live_candidate.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# This deployment is intentionally read-only. No routes or cron triggers are assigned.
# Secrets must be configured through Cloudflare encrypted secrets, never in this file.

[vars]
TRADING_MODE = "live-candidate"
EXCHANGE_MODE = "live-candidate"
NETWORK = "testnet"
ALLOW_MAINNET = "false"
LIVE_EXECUTION_ENABLED = "false"
WITHDRAWALS_ENABLED = "false"
LIVE_RELEASE_ID = ""
BUILD_GIT_SHA = ""
MARKET_DATA_PUBLIC_EXCHANGE = "coinbase"
PAPER_STARTING_BALANCE_USDT = "10000"
GUARDIAN_MAX_DRAWDOWN_PCT = "15"
GUARDIAN_MAX_API_ERRORS = "10"
GUARDIAN_MAX_FAILED_ORDERS = "5"
RATE_LIMIT_RPM = "60"
CORS_ALLOWED_ORIGINS = "https://crypto-signal-bot-indol.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "crypto-signal-bot-db"
database_id = "d647c639-845a-414e-9bb4-513e42ef4451"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "crypto-signal-bot-storage"

[[kv_namespaces]]
binding = "AGENT_MEMORY"
id = "8f0321c43b844ec08c514f1d04839a3c"
