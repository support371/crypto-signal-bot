openapi: 3.1.0
info:
  title: CryptoOps GitHub Read-Only API
  version: 4.0.0
  description: >-
    Read-only repository, pull-request, comparison, commit-check, workflow-run,
    and file-content access for support371/crypto-signal-bot. No repository write
    operation is exposed.
servers:
  - url: https://api.github.com
components:
  securitySchemes:
    githubBearer:
      type: http
      scheme: bearer
  schemas:
    OpenObject:
      type: object
      additionalProperties: true
security:
  - githubBearer: []
paths:
  /repos/support371/crypto-signal-bot:
    get:
      operationId: getRepository
      summary: Get repository metadata and default branch
      responses:
        '200':
          description: Repository metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/branches/{branch}:
    get:
      operationId: getBranch
      summary: Get a branch and its head commit
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/commits/{ref}:
    get:
      operationId: getCommit
      summary: Get commit metadata for a branch, tag, or SHA
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Commit metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/commits/{ref}/status:
    get:
      operationId: getCommitStatus
      summary: Get combined status contexts for a commit
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined commit status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/commits/{ref}/check-runs:
    get:
      operationId: getCommitCheckRuns
      summary: Get GitHub check runs for a commit
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Check runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/compare/{basehead}:
    get:
      operationId: compareRefs
      summary: Compare two refs with exact ahead and behind counts
      parameters:
        - name: basehead
          in: path
          required: true
          schema:
            type: string
            example: main...feat%2Fregulated-live-foundation
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/pulls:
    get:
      operationId: listPullRequests
      summary: List pull requests
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: head
          in: query
          required: false
          schema:
            type: string
        - name: base
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
      responses:
        '200':
          description: Pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/pulls/{pull_number}:
    get:
      operationId: getPullRequest
      summary: Get current pull-request metadata
      parameters:
        - name: pull_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pull-request metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/pulls/{pull_number}/files:
    get:
      operationId: listPullRequestFiles
      summary: List pull-request changed files
      parameters:
        - name: pull_number
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Changed files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/actions/runs:
    get:
      operationId: listWorkflowRuns
      summary: List workflow runs, optionally filtered by branch or status
      parameters:
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Workflow runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/actions/runs/{run_id}/jobs:
    get:
      operationId: getWorkflowRunJobs
      summary: Get jobs and conclusions for one workflow run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Workflow jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenObject'
  /repos/support371/crypto-signal-bot/contents/{path}:
    get:
      operationId: getFileContents
      summary: Read a repository file or directory at an exact ref
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
            default: main
      responses:
        '200':
          description: File or directory content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenObject'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenObject'
