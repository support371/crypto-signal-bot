openapi: 3.1.0
info:
  title: CryptoOps GitHub Read-Only API
  version: 2.1.0
  description: Read-only repository, pull-request, comparison, and current commit-status access for support371/crypto-signal-bot.
servers:
  - url: https://api.github.com
paths:
  /repos/support371/crypto-signal-bot:
    get:
      operationId: getRepository
      summary: Get repository metadata and default branch
      responses:
        '200':
          description: Repository metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /repos/support371/crypto-signal-bot/branches/{branch}:
    get:
      operationId: getBranch
      summary: Get a branch and its head commit
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /repos/support371/crypto-signal-bot/commits/{ref}/status:
    get:
      operationId: getCommitStatus
      summary: Get current combined status for a commit or branch
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /repos/support371/crypto-signal-bot/compare/{basehead}:
    get:
      operationId: compareRefs
      summary: Compare two refs and return exact ahead and behind counts
      parameters:
        - name: basehead
          in: path
          required: true
          schema:
            type: string
            example: main...fix%2Fcloudflare-production-readiness
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /repos/support371/crypto-signal-bot/pulls:
    get:
      operationId: listPullRequests
      summary: List pull requests
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: head
          in: query
          required: false
          schema:
            type: string
        - name: base
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
      responses:
        '200':
          description: Pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /repos/support371/crypto-signal-bot/pulls/{pull_number}:
    get:
      operationId: getPullRequest
      summary: Get current pull-request metadata
      parameters:
        - name: pull_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pull-request metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /repos/support371/crypto-signal-bot/pulls/{pull_number}/files:
    get:
      operationId: listPullRequestFiles
      summary: List changed files for a pull request
      parameters:
        - name: pull_number
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Changed files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /repos/support371/crypto-signal-bot/contents/{path}:
    get:
      operationId: getFileContents
      summary: Read one repository file or directory
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
            default: main
      responses:
        '200':
          description: File or directory content
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
security: []
