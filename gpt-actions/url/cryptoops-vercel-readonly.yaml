openapi: 3.1.0
info:
  title: CryptoOps Vercel Read-Only API
  version: 2.1.1
  description: Read-only deployment status for the frontend.
servers:
  - url: https://api.vercel.com
paths:
  /v6/deployments:
    get:
      operationId: listDeployments
      summary: List frontend deployments
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            default: team_7lMXW95WSLeyK4yAObe8FptW
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            default: prj_sdk3k44uV3pCj5p5njSzHzm1vOJX
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
      responses:
        '200':
          description: Deployment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                        name:
                          type: string
                        state:
                          type: string
                        url:
                          type: string
                      additionalProperties: true
                additionalProperties: true
  /v9/projects/{projectId}/env:
    get:
      operationId: getEnvironmentMetadata
      summary: Get project variable metadata without values
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            default: prj_sdk3k44uV3pCj5p5njSzHzm1vOJX
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            default: team_7lMXW95WSLeyK4yAObe8FptW
      responses:
        '200':
          description: Variable metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  envs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        key:
                          type: string
                        type:
                          type: string
                      additionalProperties: true
                additionalProperties: true
security: []
