openapi: 3.1.0
info:
  title: CryptoOps Cloudflare Inventory Read-Only API
  version: 2.1.1
  description: Read-only Cloudflare inventory for D1, R2, KV, and Worker scripts.
servers:
  - url: https://api.cloudflare.com/client/v4
paths:
  /accounts/{account_id}/d1/database:
    get:
      operationId: listD1Databases
      summary: List D1 databases
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: D1 databases
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                        name:
                          type: string
                      additionalProperties: true
                additionalProperties: true
  /accounts/{account_id}/r2/buckets:
    get:
      operationId: listR2Buckets
      summary: List R2 buckets
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: R2 buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        creation_date:
                          type: string
                      additionalProperties: true
                additionalProperties: true
  /accounts/{account_id}/storage/kv/namespaces:
    get:
      operationId: listKVNamespaces
      summary: List KV namespaces
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KV namespaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                additionalProperties: true
  /accounts/{account_id}/workers/scripts:
    get:
      operationId: listWorkerScripts
      summary: List Worker scripts
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        modified_on:
                          type: string
                      additionalProperties: true
                additionalProperties: true
security: []
