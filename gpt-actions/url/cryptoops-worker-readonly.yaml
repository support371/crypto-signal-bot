openapi: 3.1.0
info:
  title: CryptoOps Worker Read-Only API
  version: 3.1.1
  description: Read-only operational access to the canonical Cloudflare Worker backend.
servers:
  - url: https://crypto-signal-bot-api.gr8r9bfzry.workers.dev
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Check Worker liveness
      responses:
        '200':
          description: Liveness response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ok:
                    type: boolean
                  ts:
                    oneOf:
                      - type: integer
                      - type: number
                      - type: string
                additionalProperties: true
  /ready:
    get:
      operationId: getWorkerReadiness
      summary: Check service readiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ready:
                    type: boolean
                  paper_ready:
                    type: boolean
                  live_ready:
                    type: boolean
                additionalProperties: true
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ready:
                    type: boolean
                  blocking_reasons:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  /runtime/status:
    get:
      operationId: getRuntimeStatus
      summary: Get current runtime status
      responses:
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                type: object
                properties:
                  trading_mode:
                    type: string
                  exchange_mode:
                    type: string
                  network:
                    type: string
                  allow_mainnet:
                    type: boolean
                  live_trading_enabled:
                    type: boolean
                  withdrawals_enabled:
                    type: boolean
                additionalProperties: true
  /guardian/status:
    get:
      operationId: getGuardianStatus
      summary: Get Guardian status
      responses:
        '200':
          description: Guardian status
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggered:
                    type: boolean
                  reason:
                    oneOf:
                      - type: string
                      - type: 'null'
                  drawdown_pct:
                    type: number
                additionalProperties: true
  /agent/context:
    get:
      operationId: getAgentContext
      summary: Get consolidated operational context
      responses:
        '200':
          description: Context snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                  ts:
                    oneOf:
                      - type: integer
                      - type: number
                      - type: string
                additionalProperties: true
        '207':
          description: Partially degraded context
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                  error:
                    type: string
                additionalProperties: true
  /portfolio:
    get:
      operationId: getPortfolio
      summary: Get the simulated portfolio
      responses:
        '200':
          description: Portfolio snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  equity_usdt:
                    type: number
                  cash_usdt:
                    type: number
                  mode:
                    type: string
                additionalProperties: true
security: []
