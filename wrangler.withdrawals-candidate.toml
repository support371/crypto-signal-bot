name = "crypto-signal-bot-withdrawals-candidate"
main = "worker/src/index_withdrawals_candidate.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Separate, provider-disconnected transfer candidate.
# No routes, cron triggers, exchange credentials, or transfer permissions.
# Placeholder resource IDs intentionally prevent accidental deployment.

[vars]
WITHDRAWALS_ENABLED = "false"
TRANSFER_PROVIDER_CONFIGURED = "false"
TRANSFER_RESOURCES_CONFIGURED = "false"
BUILD_GIT_SHA = ""
CORS_ALLOWED_ORIGINS = "https://crypto-signal-bot-indol.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "crypto-signal-bot-withdrawals-candidate-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "crypto-signal-bot-withdrawals-candidate-storage"
